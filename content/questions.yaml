# options は画面に出す順に書く。label は会場で配るものに書いたラベル（A・B・C）。rank 1 が最も高価
title: 2026 忘年会 格付けチェック # 会のタイトル。タイトル画面に出る（参加者にも見える）
questions:
  - mode: pick
    title: ワイン
    description: 高いワインはどちら？
    explanation: B は 1本 8万円のシャトー・マルゴー。A はスーパーで買える 1本 900円の赤ワインでした。
    options:
      - { label: B, image: ボルドー.jpg, note: フランス産の赤ワイン, rank: 1 }
      - { label: A, image: テーブルワイン.jpg, note: チリ産の赤ワイン, rank: 2 }

  - mode: order
    title: 焼肉
    description: 値段の高い順に並べてください
    explanation: A は A5 ランクの黒毛和牛、C は国産の交雑牛、B はアメリカ産の牛ロースでした。
    options:
      - { label: C, image: 国産牛.png, note: 脂の多い牛肉, rank: 2 }
      - { label: A, image: A5和牛.png, note: 霜降りの牛肉, rank: 1 }
      - { label: B, image: 輸入牛.png, note: 赤身の牛肉, rank: 3 }

  - mode: pick
    title: チョコレート
    description: 高いチョコレートはどちら？
    explanation: A はベルギー産のトリュフで 1粒 600円。B はコンビニのミルクチョコ（1枚 150円）でした。
    options:
      - { label: B, image: 板チョコ.jpg, note: 板状のチョコレート, rank: 2 }
      - { label: A, image: 高級チョコ.jpg, note: 粒のチョコレート, rank: 1 }
